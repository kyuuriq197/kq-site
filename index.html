<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>kyuuriq - профиль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <div class="snow" id="snow" aria-hidden="true"></div>

    <!-- click to enter -->

        <button class="enter-btn" id="enterBtn" type="button">click to enter</button>
    </div>

    <main class="wrap">
        <section class="card" aria-label="Профиль">

            <div class="avatar-wrap">
                <img class="avatar" src="avatar.png" alt="Аватар" onerror="this.src='bg.png'">
                <span class="status" title="online"></span>
            </div>

            <h1 class="name">kyuuriq</h1>
            <p class="handle">@kyuuriq</p>
            <p class="bio">мой маленький уголок в интернете</p>

            <div class="socials">
                <a class="social" href="https://github.com/kyuuriq197/" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">

                </a>
                <a class="social" href="https://t.me/kyuuriq" target="_blank" rel="noopener" aria-label="Telegram" title="Telegram">
                    <svg viewBox="0 0 24 24" focusable="false"><path d="M21.94 4.4l-3.06 14.44c-.23 1.02-.84 1.27-1.7.79l-4.7-3.46-2.27 2.18c-.25.25-.46.46-.94.46l.34-4.77 8.68-7.84c.38-.34-.08-.53-.58-.19L6.99 13.2 2.35 11.75c-1.01-.32-1.03-1.01.21-1.5L20.6 2.94c.84-.31 1.58.2 1.34 1.46z"/></svg>

                </a>
                <a class="social" href="https://t.me/deadonsky" target="_blank" rel="noopener" aria-label="Telegram исполнителя" title="Telegram исполнителя">
                    <span class="social-emoji">🎵</span>
                </a>
            </div>

            <div class="music">
                <audio id="audio" src="music.mp3" preload="none"></audio>
                <div class="player">
                    <button class="player-btn" id="musicBtn" type="button" aria-pressed="false" aria-label="Воспроизвести">
                        <span id="musicIcon">▶</span>
                    </button>
                    <div class="player-info">
                        <div class="player-title">celujte monitory — keijo</div>
                        <div class="player-bar">
                            <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Прогресс">
                        </div>
                        <div class="player-time">
                            <span id="cur">0:00</span>
                            <span id="dur">0:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="stats">
                <span>kyuuriq</span>
                <span class="dot">·</span>
                <span>уголок</span>
            </div>
        </section>

        <footer>
            © 2026 kyuuriq
        </footer>
    </main>

    <script>
        // Снег
        (function () {
            const container = document.getElementById('snow');
            if (!container) return;
            const COUNT = window.matchMedia('(max-width: 640px)').matches ? 24 : 44;
            for (let i = 0; i < COUNT; i++) {
                const flake = document.createElement('span');
                flake.className = 'flake';
                flake.textContent = '❅';
                flake.style.left = (Math.random() * 100) + 'vw';
                flake.style.animationDuration = (6 + Math.random() * 8) + 's';
                flake.style.animationDelay = (-Math.random() * 12) + 's';
                flake.style.fontSize = (10 + Math.random() * 14) + 'px';
                flake.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
                container.appendChild(flake);
            }
        })();

        // Click to enter
        (function () {
            const overlay = document.getElementById('enter');
            const btn = document.getElementById('enterBtn');
            const audio = document.getElementById('audio');
            if (!overlay || !btn) return;
            btn.addEventListener('click', async () => {
                overlay.classList.add('hidden');
                try { if (audio) await audio.play(); } catch (e) {}
                const musicBtn = document.getElementById('musicBtn');
                const icon = document.getElementById('musicIcon');
                if (musicBtn) { musicBtn.classList.add('playing'); musicBtn.setAttribute('aria-pressed', 'true'); }
                if (icon) icon.textContent = '❚❚';
            });
        })();

        // Музыка
        (function () {
            const audio = document.getElementById('audio');
            const btn = document.getElementById('musicBtn');
            const icon = document.getElementById('musicIcon');
            const seek = document.getElementById('seek');
            const cur = document.getElementById('cur');
            const dur = document.getElementById('dur');
            if (!audio || !btn) return;

            function fmt(t) {
                if (!isFinite(t)) return '0:00';
                const m = Math.floor(t / 60);
                const sec = Math.floor(t % 60);
                return m + ':' + (sec < 10 ? '0' : '') + sec;
            }

            btn.addEventListener('click', async () => {
                try {
                    if (audio.paused) {
                        await audio.play();
                        btn.setAttribute('aria-pressed', 'true');
                        btn.classList.add('playing');
                        if (icon) icon.textContent = '\u275A\u275A';
                    } else {
                        audio.pause();
                        btn.setAttribute('aria-pressed', 'false');
                        btn.classList.remove('playing');
                        if (icon) icon.textContent = '\u25B6';
                    }
                } catch (e) {
                    if (icon) icon.textContent = '!';
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                if (dur) dur.textContent = fmt(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                if (cur) cur.textContent = fmt(audio.currentTime);
                if (seek && audio.duration) {
                    seek.value = (audio.currentTime / audio.duration) * 100;
                }
            });

            audio.addEventListener('ended', () => {
                btn.setAttribute('aria-pressed', 'false');
                btn.classList.remove('playing');
                if (icon) icon.textContent = '\u25B6';
                if (seek) seek.value = 0;
            });

            if (seek) {
                seek.addEventListener('input', () => {
                    if (audio.duration) {
                        audio.currentTime = (seek.value / 100) * audio.duration;
                    }
                });
            }
        })();
    </script>

</body>
</html>
