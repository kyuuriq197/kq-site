<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>kyuuriq - профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фон (используется аватарная картинка; при желании замени на видео bg.mp4) -->
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- Снег -->
    <div class="snow" id="snow" aria-hidden="true"></div>

    <main class="wrap">
        <section class="card" aria-label="Профиль">

            <div class="avatar-wrap">
                <img class="avatar" src="avatar.png" alt="Аватар" onerror="this.src='bg.png'">
                <span class="status" title="онлайн"></span>
            </div>

            <h1 class="name">kyuuriq</h1>
            <p class="handle">@kyuuriq</p>
            <p class="bio">мой маленький уголок в интернете</p>

            <div class="links">
                <a class="link" href="https://github.com/kyuuriq197/" target="_blank" rel="noopener">
                    <span class="link-icon">⌥</span>
                    <span>GitHub</span>
                </a>
                <a class="link" href="https://t.me/kyuuriq" target="_blank" rel="noopener">
                    <span class="link-icon">✈</span>
                    <span>Telegram</span>
                </a>
                <button class="link" type="button" data-copy="kyuuriq." id="discordBtn">
                    <span class="link-icon">💬</span>
                    <span id="discordLabel">Discord: kyuuriq.</span>
                </button>
                <a class="link" href="https://steamcommunity.com/id/kyuuriq" target="_blank" rel="noopener">
                    <span class="link-icon">🎮</span>
                    <span>Steam</span>
                </a>
                <a class="link" href="https://t.me/deadonshy" target="_blank" rel="noopener">
                    <span class="link-icon">🎵</span>
                    <span>Telegram исполнителя</span>
                </a>
            </div>

            <div class="music">
                <audio id="audio" src="music.aac" preload="none"></audio>
                <button class="music-btn" id="musicBtn" type="button" aria-pressed="false">
                    <span class="music-icon">♪</span>
                    <span id="musicLabel">celujte monitory — keijo</span>
                </button>
                <a class="music-link" href="https://link.rpluslb.ru/u_are_my_sun" target="_blank" rel="noopener">smart-линк</a>
            </div>

            <div class="stats">
                <span>kyuuriq</span>
                <span>·</span>
                <span>уголок</span>
            </div>
        </section>

        <footer>
            © 2026 kyuuriq
            <small class="credit">фон — wallhaven (vp2dxl)</small>
        </footer>
    </main>

    <script>
        // Снег
        (function () {
            const container = document.getElementById('snow');
            if (!container) return;
            const COUNT = window.matchMedia('(max-width: 640px)').matches ? 28 : 48;
            for (let i = 0; i < COUNT; i++) {
                const flake = document.createElement('span');
                flake.className = 'flake';
                flake.textContent = '❅';
                flake.style.left = (Math.random() * 100) + 'vw';
                flake.style.animationDuration = (6 + Math.random() * 8) + 's';
                flake.style.animationDelay = (-Math.random() * 12) + 's';
                flake.style.fontSize = (10 + Math.random() * 14) + 'px';
                flake.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
                container.appendChild(flake);
            }
        })();

        // Discord copy
        (function () {
            const btn = document.getElementById('discordBtn');
            const label = document.getElementById('discordLabel');
            if (!btn) return;
            const original = label ? label.textContent : '';
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText('kyuuriq.');
                    if (label) label.textContent = 'скопировано ✓';
                    setTimeout(() => { if (label) label.textContent = original; }, 1600);
                } catch (e) {
                    if (label) label.textContent = 'не удалось скопировать';
                }
            });
        })();

        // Музыка
        (function () {
            const audio = document.getElementById('audio');
            const btn = document.getElementById('musicBtn');
            const label = document.getElementById('musicLabel');
            if (!audio || !btn) return;
            btn.addEventListener('click', async () => {
                try {
                    if (audio.paused) {
                        await audio.play();
                        btn.setAttribute('aria-pressed', 'true');
                        btn.classList.add('playing');
                        label.textContent = 'выключить музыку';
                    } else {
                        audio.pause();
                        btn.setAttribute('aria-pressed', 'false');
                        btn.classList.remove('playing');
                        label.textContent = 'celujte monitory — keijo';
                    }
                } catch (e) {
                    label.textContent = 'не удалось воспроизвести';
                }
            });
        })();
    </script>

</body>
</html>
