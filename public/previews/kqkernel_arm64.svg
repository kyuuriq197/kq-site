<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="kqkernel_arm64 — ARM64 kernel experiments preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6dcff"/>
      <stop offset="0.55" stop-color="#efe9ff"/>
      <stop offset="1" stop-color="#f4f1ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- soft shapes -->
  <circle cx="150" cy="130" r="160" fill="#dcc9fb"/>
  <circle cx="1060" cy="610" r="140" fill="#cfd8f9"/>
  <rect x="1020" y="110" width="80" height="80" rx="24" transform="rotate(-12 1060 150)" fill="#ffffff"/>

  <!-- kernel core: concentric rounded rectangles -->
  <rect x="400" y="170" width="400" height="400" rx="72" fill="#6a4fb8"/>
  <rect x="455" y="225" width="290" height="290" rx="56" fill="#8e73d8"/>
  <rect x="510" y="280" width="180" height="180" rx="42" fill="#c3b2f5"/>
  <rect x="556" y="326" width="88" height="88" rx="26" fill="#efeaff"/>

  <!-- orbit ring -->
  <ellipse cx="600" cy="370" rx="268" ry="200" fill="none" stroke="#b9a4ef" stroke-width="5" opacity="0.65" transform="rotate(-8 600 370)"/>
  <circle cx="352" cy="404" r="13" fill="#6a4fb8"/>
  <circle cx="856" cy="330" r="13" fill="#8e73d8"/>

  <!-- memory slabs -->
  <g>
    <rect x="140" y="470" width="220" height="64" rx="18" fill="#41307a"/>
    <rect x="140" y="550" width="180" height="64" rx="18" fill="#5548a0"/>
    <rect x="140" y="630" width="260" height="64" rx="18" fill="#6a5bb8"/>
  </g>
  <rect x="170" y="438" width="110" height="20" rx="10" fill="#8e73d8"/>

  <!-- register columns -->
  <g fill="#a892e8">
    <rect x="840" y="500" width="64" height="150" rx="18"/>
    <rect x="924" y="470" width="64" height="180" rx="18"/>
    <rect x="1008" y="430" width="64" height="220" rx="18"/>
  </g>
  <rect x="840" y="250" width="190" height="20" rx="10" fill="#b9a4ef"/>

  <!-- floating chip tag -->
  <g transform="translate(940 180)">
    <rect width="150" height="46" rx="23" fill="#6a4fb8"/>
    <rect x="52" y="16" width="46" height="14" rx="7" fill="#efeaff"/>
  </g>
</svg>
