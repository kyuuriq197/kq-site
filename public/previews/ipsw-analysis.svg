<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="iphone14-5-ios-27-2-ipsw-analysis — firmware research preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1da"/>
      <stop offset="0.55" stop-color="#fdf6e8"/>
      <stop offset="1" stop-color="#f6f0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- soft shapes -->
  <circle cx="1030" cy="180" r="170" fill="#f3dcc0"/>
  <circle cx="120" cy="600" r="140" fill="#d6dff6"/>
  <rect x="580" y="60" width="70" height="70" rx="22" transform="rotate(16 615 95)" fill="#ffe2ae"/>

  <!-- document card -->
  <rect x="120" y="140" width="560" height="440" rx="40" fill="#ffffff" stroke="#f2e2c6" stroke-width="2"/>
  <circle cx="182" cy="204" r="22" fill="#f3dcc0"/>
  <rect x="220" y="196" width="180" height="18" rx="9" fill="#e8d3ac"/>
  <rect x="168" y="266" width="420" height="16" rx="8" fill="#efe4cb"/>
  <rect x="168" y="306" width="368" height="16" rx="8" fill="#efe4cb"/>
  <rect x="168" y="386" width="76" height="30" rx="15" fill="#e9a23b"/>
  <rect x="256" y="390" width="230" height="22" rx="11" fill="#ffe4b3"/>
  <rect x="168" y="452" width="460" height="16" rx="8" fill="#efe4cb"/>
  <rect x="168" y="492" width="340" height="16" rx="8" fill="#efe4cb"/>

  <!-- hex badge (diamond) -->
  <g transform="translate(700 210) rotate(45)">
    <rect width="132" height="132" rx="30" fill="#c9882d"/>
    <rect x="28" y="28" width="76" height="76" rx="18" fill="#f6d9a8"/>
    <rect x="46" y="46" width="40" height="40" rx="12" fill="#8a5c17"/>
  </g>

  <!-- magnifier -->
  <g transform="translate(760 420)">
    <circle cx="0" cy="0" r="128" fill="rgba(255,255,255,0.42)" stroke="#20283e" stroke-width="16"/>
    <rect x="96" y="112" width="120" height="34" rx="17" fill="#20283e" transform="rotate(45 100 120)"/>
    <rect x="-52" y="-66" width="96" height="16" rx="8" fill="#e9a23b"/>
    <rect x="-52" y="-26" width="70" height="16" rx="8" fill="rgba(255,255,255,0.75)"/>
  </g>

  <!-- blocks -->
  <g transform="translate(180 624)">
    <rect width="150" height="44" rx="22" fill="#20283e"/>
    <rect x="26" y="15" width="98" height="14" rx="7" fill="#ffe4b3"/>
  </g>
  <g transform="translate(920 60) rotate(8)">
    <rect width="128" height="40" rx="20" fill="#e9a23b"/>
    <rect x="24" y="13" width="80" height="14" rx="7" fill="#fff1da"/>
  </g>
</svg>
